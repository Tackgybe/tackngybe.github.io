<html lang="en">
<head>
    <!-- Metadata about the webpage -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main header section -->
    <header>
        <h1>Welcome to My Website! 🚀</h1>
        <p>Built with HTML, CSS, and JavaScript, hosted on GitHub Pages.</p>
    </header>

    <!-- Interactive main content section -->
    <main>
        <section class="card">
            <h2>Interactive Section</h2>
            <p>Click the button below to see JavaScript in action!</p>
            <!-- A button that triggers a JavaScript function when clicked -->
            <button id="actionBtn">Click Me!</button>
            <p id="outputMessage" class="hidden"></p>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Future Developer. All rights reserved.</p>
    </footer>

    <!-- Link to our external JavaScript file (placed at the bottom so the page loads first) -->
    <script src="script.js"></script>
</body>
